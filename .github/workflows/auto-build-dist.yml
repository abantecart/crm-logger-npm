name: Auto Build Dist

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'proto/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/auto-build-dist.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Build dist
        run: npm run build

      - name: Commit updated dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f dist
          if git diff --cached --quiet; then
            echo "No dist changes"
            exit 0
          fi

          git commit -m "chore(ci): auto-build dist"
          git push
