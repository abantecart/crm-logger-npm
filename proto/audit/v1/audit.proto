syntax = "proto3";

package audit.v1;

import "google/protobuf/struct.proto";

service AuditService {
  rpc LogAccess(LogAccessRequest) returns (AuditWriteResponse);
  rpc LogChange(LogChangeRequest) returns (AuditWriteResponse);
  rpc LogActivity(LogActivityRequest) returns (AuditWriteResponse);
  rpc GetAuditHealth(GetAuditHealthRequest) returns (GetAuditHealthResponse);
}

message AuditContext {
  string actor_id = 1;
  string actor_type = 2;
  string tenant_id = 3;
  string request_id = 4;
  string ip = 5;
  string user_agent = 6;
  string session_id = 7;
  string source = 8;
}

message AccessLogInput {
  string event_type = 1;
  string route = 2;
  int32 status_code = 3;
  int32 duration_ms = 4;
  string auth_method = 5;
  string outcome = 6;
  google.protobuf.Struct meta = 7;
  Geo geo = 8;
}

message Geo {
  string country = 1;
  string region = 2;
}

message ChangeLogInput {
  string change_type = 1;
  string entity_type = 2;
  string entity_id = 3;
  string operation = 4;
  google.protobuf.Struct before = 5;
  google.protobuf.Struct after = 6;
  string description = 7;
  string system_reason = 8;
  string parent_id = 9;
  google.protobuf.Struct meta = 10;
}

message ActivityLogInput {
  string entity_type = 1;
  string entity_id = 2;
  string operation = 3;
  string activity = 4;
  string category = 5;
  google.protobuf.Struct meta = 6;
}

message LogAccessRequest {
  AuditContext context = 1;
  AccessLogInput input = 2;
}

message LogChangeRequest {
  AuditContext context = 1;
  ChangeLogInput input = 2;
}

message LogActivityRequest {
  AuditContext context = 1;
  ActivityLogInput input = 2;
}

message GetAuditHealthRequest {}

message AuditWriteResponse {
  bool ok = 1;
  string message = 2;
}

message DriverHealth {
  string name = 1;
  int64 last_success_at = 2;
  int64 last_failure_at = 3;
}

message GetAuditHealthResponse {
  int64 last_success_at = 1;
  int64 failures_total = 2;
  DriverHealth driver = 3;
}
